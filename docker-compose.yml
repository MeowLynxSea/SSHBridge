version: '3.8'

services:
  sshbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sshbridge
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - WEB_PORT=3000
      - SSH_PORT=2222
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production}
    volumes:
      - sshbridge_data:/app/data
      - sshbridge_hostkey:/app/hostkey

volumes:
  sshbridge_data:
    driver: local
  sshbridge_hostkey:
    driver: local
